{% extends "base.html" %}

{% block title %}Error - AfriNovel Reader{% endblock %}

{% block content %}
<div class="container">
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1>{{ error|default:"An error occurred" }}</h1>
        <p>The book file could not be loaded or accessed.</p>
        <a href="{% url 'imported_books_home' %}" class="button">
            <span class="icon">←</span> Back to Books
        </a>
    </div>
</div>

<style>
.error-container {
    text-align: center;
    padding: 60px 20px;
}

.error-icon {
    font-size: 64px;
    margin-bottom: 24px;
}

.error-container h1 {
    color: var(--color-danger);
    margin-bottom: 12px;
}

.error-container p {
    color: var(--color-text-secondary);
    margin-bottom: 32px;
}

.button {
    display: inline-block;
    padding: 10px 20px;
    background: var(--color-accent);
    color: white;
    text-decoration: none;
    border-radius: 4px;
    transition: all 0.2s;
}

.button:hover {
    opacity: 0.9;
}

.icon {
    margin-right: 6px;
}
</style>
{% endblock %}
