{% extends "base.html" %}
{% block title %}Enter {{ competition.title }} | AfriNovel{% endblock %}
{% block content %}<main class="container platform-form"><p class="eyebrow">{{ competition.title }}</p><h1>Submit a story</h1><p>{{ competition.submission_requirements }}</p><form method="post">{% csrf_token %}{{ form.as_p }}<button class="button" type="submit">Submit entry</button></form></main>{% endblock %}
{% block extra_css %}<style>.platform-form{max-width:760px;padding:42px 20px 80px}.platform-form h1{margin:5px 0}.platform-form>p{color:var(--brand-ink-soft)}.eyebrow{color:var(--brand-green);font-size:.72rem;font-weight:800;letter-spacing:.12em}.platform-form form{background:var(--brand-card);border:1px solid var(--brand-line);padding:24px;border-radius:10px}.platform-form p{display:grid;gap:7px}.platform-form input,.platform-form textarea,.platform-form select{padding:10px;border:1px solid var(--brand-line);border-radius:5px;background:var(--brand-paper);color:var(--brand-ink);width:100%}</style>{% endblock %}
