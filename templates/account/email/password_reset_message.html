<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Confirmation</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f8f9fa; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { background: #222; color: white; padding: 30px; text-align: center; }
    .header h1 { margin: 0; font-size: 24px; }
    .content { padding: 30px; }
    .content p { margin: 0 0 20px; }
    .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 4px; margin: 20px 0; }
    .footer { background: #f8f9fa; padding: 20px; text-align: center; font-size: 12px; color: #666; border-top: 1px solid #333; }
    .footer a { color: #4b64ff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>✅ Password Reset Complete</h1>
    </div>
    <div class="content">
      <p>Hello {{ user.username }},</p>
      <div class="success">
        <p style="margin: 0;">Your AfriNovel password has been successfully reset.</p>
      </div>
      <p>You can now sign in with your new password.</p>
      <p>If you didn't make this change, please contact support immediately.</p>
    </div>
    <div class="footer">
      <p>Best regards,<br>The AfriNovel Team</p>
    </div>
  </div>
</body>
</html>
