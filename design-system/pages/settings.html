<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | BookClub Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../storybook.css" />
  </head>
  <body>
    <div class="design-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">B</div>
          <div>
            <div class="brand-name">BookClub</div>
            <div class="brand-subtitle">Admin Console</div>
          </div>
        </div>

        <div class="side-section">
          <div class="side-label">Navigation</div>
          <a class="nav-link" href="../index.html">Storybook home</a>
          <a class="nav-link" href="./overview.html">Overview</a>
          <a class="nav-link" href="./users.html">Users</a>
          <a class="nav-link is-active" href="./settings.html">Settings</a>
          <a class="nav-link" href="./logs.html">Logs</a>
          <a class="nav-link" href="./crud-editor.html">CRUD editor</a>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="search">
            <span>⌕</span>
            <input type="search" placeholder="Search settings, policies, features..." />
          </div>
          <div class="topbar-actions">
            <button class="icon-btn" data-theme-toggle type="button">☾</button>
            <button class="secondary-btn" type="button">Reset</button>
            <button class="primary-btn" type="button">Save changes</button>
          </div>
        </header>

        <div class="page">
          <div class="page-header">
            <div>
              <div class="kicker">Configuration</div>
              <h1>Settings</h1>
            </div>
          </div>

          <section class="panel">
            <div class="panel-header">
              <h2>General admin settings</h2>
            </div>
            <div class="form-grid">
              <div class="field">
                <label>Brand name</label>
                <input type="text" value="BookClub" />
              </div>
              <div class="field">
                <label>Default language</label>
                <select>
                  <option>English (US)</option>
                  <option>English (UK)</option>
                  <option>Spanish</option>
                </select>
              </div>
              <div class="field" style="grid-column: 1 / -1;">
                <label>Support contact</label>
                <input type="text" value="support@bookclub.app" />
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="../storybook.js"></script>
  </body>
</html>
